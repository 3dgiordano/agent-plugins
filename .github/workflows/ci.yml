name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: it is where paths, the temp dir and shell quoting differ.
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Versions in sync across manifests
        run: node scripts/version.js --check

      - name: Test suite (structure + hook adapters for Claude Code and Cursor)
        run: node scripts/test.js

      - name: Docs agree with the code (README message samples)
        run: node scripts/samples.js --check

      - name: Detector recall / precision floors
        run: node scripts/corpus.js --check

      - name: Host parity (Claude Code + Cursor adapters)
        run: node scripts/hosts.js --check
