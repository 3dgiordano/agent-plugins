name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it makes stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The suite takes about five minutes and bench-check two; a hung job stops here.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: it is where paths, the temp dir and shell quoting differ.
        # macOS: its temp dir sits under /var/folders behind a symlink, and its
        # file system is case-insensitive by default.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          # The history and the tags: the version-step rule compares with the last release.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Versions in sync across manifests
        run: node scripts/version.js --check

      - name: One version step per plugin since the last release
        run: node scripts/pluginsource.js

      - name: Claude plugin directory pre-submission checks (docs/DIRECTORY.md)
        run: node scripts/directory-check.js

      - name: Test suite (structure + hook adapters for Claude Code and Cursor)
        run: node scripts/test.js

      - name: Docs agree with the code (README message samples)
        run: node scripts/samples.js --check

      - name: Detector recall / precision floors
        run: node scripts/corpus.js --check

      - name: Host parity (Claude Code + Cursor adapters)
        run: node scripts/hosts.js --check

      # The graders behind every published bench number, against their pass and
      # fail fixtures. No agent, no network; once per operating system.
      - name: Bench graders against their fixtures
        if: matrix.node == 22
        run: node scripts/bench-check.js
