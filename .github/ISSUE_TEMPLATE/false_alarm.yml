name: False alarm or missed reminder
description: A hook reminded the agent about something that was not there, or stayed quiet when it should have spoken.
labels: [detector]
body:
  - type: markdown
    attributes:
      value: |
        Every false reading found in a real session is added to the detector's corpus before its pattern changes
        (CONTRIBUTING.md, "Improving a detector from real closes"). Paraphrase what you paste: the shape of the sentence
        matters, not your project's names.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - executive-self-monitoring
        - epistemic-self-monitoring
        - persistence-self-monitoring
        - termination-self-monitoring
        - coverage-self-monitoring
        - handoff-self-monitoring
        - progress-self-monitoring
        - integrity-self-monitoring
        - aspiration-self-monitoring
        - hygiene-self-monitoring
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which way it was wrong
      options:
        - It spoke, and there was nothing to find (false alarm)
        - It stayed quiet, and there was something to find (miss)
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: The line it read, paraphrased
      description: The agent's sentence, command or edit the hook reacted to (or should have), with names and paths replaced.
      render: text
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What the hook said
      description: The reminder as the agent received it, if it spoke. Its fixed text names a path and a kind, never your content.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "coverage-self-monitoring 0.7.3 · Claude Code 2.1.x · Windows 11"
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I can submit this under the repository's licence (Apache-2.0, `LICENSE` section 5), and what I pasted is paraphrased or scrubbed (CONTRIBUTING.md, "Licence and credit").
          required: true
